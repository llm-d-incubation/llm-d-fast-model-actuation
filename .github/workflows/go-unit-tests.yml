name: go-unit-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run Go unit tests
        run: make test

      - name: analyze coverage by func
        run: go tool cover -func=cover/unit-profile.txt -o cover/unit-func.txt

      - name: upload unit test coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit-profile.txt
          path: cover/unit-profile.txt
          archive: false
          retention-days: 14

      - name: upload unit test func analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit-func.txt
          path: cover/unit-func.txt
          archive: false
          retention-days: 14
