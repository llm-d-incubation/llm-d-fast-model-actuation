# Tests launcher-based server-providing pods in a `kind` cluster
name: Launcher-Based E2E Test

on:
  # So we can trigger manually if needed
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/launcher-based-e2e-test.yml"
      - Makefile
      - api/**
      - charts/**
      - cmd/dual-pods-controller/**
      - cmd/launcher-populator/**
      - cmd/test-requester/**
      - config/**
      - dockerfiles/Dockerfile.launcher.cpu
      - go.*
      - inference_server/launcher/**
      - pkg/**
      - scripts/*
      - test/e2e/**
      - '!test/e2e/*.md'
      - '!test/e2e/demo-fma-hpa/**'

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/launcher-based-e2e-test.yml"
      - Makefile
      - api/**
      - charts/**
      - cmd/dual-pods-controller/**
      - cmd/launcher-populator/**
      - cmd/test-requester/**
      - config/**
      - dockerfiles/Dockerfile.launcher.cpu
      - go.*
      - inference_server/launcher/**
      - pkg/**
      - scripts/*
      - test/e2e/**
      - '!test/e2e/*.md'
      - '!test/e2e/demo-fma-hpa/**'

jobs:
  debug:
    name: print relevant info
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "github.actor=${{ github.actor }}"
          echo "github.action_ref=${{ github.action_ref }}"
          echo "github.event_name=${{ github.event_name }}"
          echo "github.head_ref=$GITHUB_HEAD_REF"
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.repository=${{ github.repository }}"
          echo "github.repository_owner=${{ github.repository_owner }}"
          echo "github.triggering_actor=${{ github.triggering_actor }}"
          echo "GITHUB_ACTION_REF=$GITHUB_ACTION_REF"

  run-launcher-test:
    strategy:
      matrix:
        release: [ "", "0.6.4", "0.6.5-alpha.1" ]
    env:
      coverdir: "cover-dpc-${{ matrix.release || 'local' }}"
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.15.2

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run launcher-based E2E test
        run: test/e2e/run-launcher-based.sh --release "${{ matrix.release }}"

      - name: list all pods
        if: always()
        run: kubectl get pods -A -o wide

      - name: list test pods with labels
        if: always()
        run: kubectl get pods -L dual-pods.llm-d.ai/dual,dual-pods.llm-d.ai/sleeping,dual-pods.llm-d.ai/instance,dual-pods.llm-d.ai/launcher-config-name

      - name: list ReplicaSets
        if: always()
        run: kubectl get rs -A

      - name: Dump previous log of first dual-pods controller
        if: always()
        run: |
          if [ -r dual-pods-controller-first-prev.log ]
          then cat dual-pods-controller-first-prev.log
          else echo The first dual-pods controller ran at most once
          fi

      - name: Dump log of first dual-pods controller
        if: always()
        run: |
          if [ -r dual-pods-controller-first.log ]
          then cat dual-pods-controller-first.log
          else echo The first dual-pods controller left no log
          fi

      - name: dump dual-pods controller log
        if: always()
        run: kubectl logs deploy/fma-dual-pods-controller

      - name: dump launcher-populator log
        if: always()
        run: kubectl logs deploy/fma-launcher-populator || echo "launcher-populator not deployed"

      - name: dump GPU allocations
        if: always()
        run: kubectl get cm gpu-allocs -o yaml

      - name: dump GPU map
        if: always()
        run: kubectl get cm gpu-map -o yaml

      - name: dump InferenceServerConfigs
        if: always()
        run: kubectl get inferenceserverconfigs -o yaml

      - name: dump LauncherConfigs
        if: always()
        run: kubectl get launcherconfigs -o yaml

      - name: dump YAML of test pods
        if: always()
        run: kubectl get pods -o yaml

      - name: dump launcher pod logs
        if: always()
        run: |
          for pod in $(kubectl get pods -l dual-pods.llm-d.ai/launcher-config-name -o name); do
            echo "=== Logs for $pod ==="
            kubectl logs $pod || echo "Failed to get logs for $pod"
          done

      - name: dump vLLM instance logs from launchers
        if: always()
        run: scripts/dump-launcher-vllm-logs.sh

      - name: dump scrape of first dual-pods controller
        if: always()
        run: cat scrape1.metrics || true

      - name: dump scrape of final dual-pods controller
        if: always()
        run: cat scrape2.metrics || true

      - name: dump scrape of launcher population controller
        if: always()
        run: cat scrape2p.metrics || true

      - name: extract coverage data from dual pods controller
        run: |
          kubectl scale deploy/fma-dual-pods-controller --replicas=0
          let try=1
          while (( try <= 6 )) && ! kubectl get pods -l "app.kubernetes.io/component=dual-pods-controller" -o name | wc -l | grep -wq 0; do
              sleep 15
              let try=try+1
          done
          echo scaling up the inspector after DPC wait try $try
          kubectl scale deploy/fma-dpc-coverdata-inspector --replicas=1
          kubectl wait deploy/fma-dpc-coverdata-inspector --for condition=Available
          insp=$(kubectl get pods -l app.kubernetes.io/component=dpc-coverdata-inspector -o name | sed s:^pod/::)
          mkdir -p "${{ env.coverdir }}/data"
          kubectl wait pod "${insp}" --for condition=Ready
          kubectl cp "${insp}:var/coverdata" "${{ env.coverdir }}/data"
          ls -l "${{ env.coverdir }}/data"
          go tool covdata func -i "${{ env.coverdir }}/data" > "${{ env.coverdir }}-func.txt"

      - name: upload coverage data from dual pods controller
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.coverdir }}-data"
          path: "${{ env.coverdir }}/data"
          retention-days: 14

      - name: upload coverage summary from dual pods controller
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "${{ env.coverdir }}-func.txt"
          archive: false
          retention-days: 14

      - name: upload Prometheus snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "snap-${{ matrix.release || 'local' }}"
          path: snaps
          retention-days: 14
